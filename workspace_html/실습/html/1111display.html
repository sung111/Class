<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>four seasons</title>
  <link rel="stylesheet" href="/실습/css/1111display.css">
</head>
<body>
  <div class="top">
    <div class="one">
      <div class="number">1</div>
      <div class="seasons">spring</div>
      <div><p>따뜻한 봄이 왔다. 새들은 즐겁게 아침을 노래하고 시냇물은 부드럽게 속삭이며 흐른다.</p></div>
    </div>
    <div class="two">
      <div class="number">2</div>
      <div class="seasons">summer</div>
      <div><p>뜨거운 여름이 다가오면 타는 듯 뜨거운 태양 아래 사람도 양도 모두 지쳐버린다</p></div>
    </div>
    <div class="three">
      <div class="number">3</div>
      <div class="seasons">fall</div>
      <div><p>농부들이 풍성한 수확의 기쁨을 나누며 술과 춤 잔치를 벌인다.</p></div>
    </div>
    <div class="four">
      <div class="number">4</div>
      <div class="seasons">winter</div>
      <div><p>얼어붙을 듯이 차가운 겨울. 눈이내린다.</p></div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    window.addEventListener("load",function(){
      document.querySelector('#btn1').addEventListener('click',function(){

        // ajax 객체 생성
        const xhr = new XMLHttpRequest();
        //보낼 준비
        // xhr.open('get','http://127.0.0.1:5500/javascript/11.jsons.html')
        xhr.open('get','https://jsonplaceholder.typicode.com/users')
        //보내기
        xhr.send();
        //다녀온 뒤
        xhr.onload = function(){
          console.log('다녀왔다이')
          console.log(xhr.responseText)
          
          const data = JSON.parse(xhr.responseText)
          console.log(data)

          console.log(data[0].name)
          console.log(data[0].address.geo.lat)
        }
      })


      document.querySelector('#btn2').addEventListener('click',function(){

        const xhr = new XMLHttpRequest();
        xhr.open('get','https://polling.finance.naver.com/api/realtime?query=SERVICE_ITEM:034220%7CSERVICE_RECENT_ITEM:034220,005930,089590&_callback=window.__jindo2_callback._2136')
        xhr.send();
        xhr.onload = function(){
          console.log('다녀왔다이')
          console.log(xhr.responseText)
          
          const data = JSON.parse(xhr.responseText)
          console.log(data)

          console.log(data[0].name)
          console.log(data[0].address.geo.lat)
        }
      })

      document.querySelector('#btn3').addEventListener('click',function(){

        const xhr = new XMLHttpRequest();

        // get 방식의 전달인자 보내기
        // 서버 "서버ip:port/주소"
        // 주소?키=벨류&key=value&key2=value2
        let url = 'http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtFcst'
        url += '?'
        url += 'serviceKey=oA5rk5gYBsyp78uUDGjwdMpKF%2Fh7ePs%2F7D8HpQEJ8ulkkKWLXrb7zrIG59z4wtuz7sK9tiY5pAF3lYZc231Sig%3D%3D'
        url += '&'
        url += 'dataType='+'JSON'
        url += '&'
        url += 'base_date='+'20250113'
        url += '&'
        url += 'base_time='+'1600'
        url += '&'
        url += 'nx='+'63'
        url += '&'
        url += 'ny='+'110'
        url += '&'
        url += 'numOfRows='+'100'
        console.log(url)
        


        xhr.open('get', url)
        xhr.send();
        xhr.onload = function(){
          console.log('다녀왔다이')
          console.log(xhr.responseText)
          
          const data = JSON.parse(xhr.responseText)
          console.log(data)

        }
      })



    })
  </script>
</head>
<body>
  <button type="button" id="btn1">ajax실행</button>
  <button type="button" id="btn2">lg디스플레이 실시간 주가</button>
  <button type="button" id="btn3">날씨</button>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      border: 1px solid red;
      width: 100px;
      height: 100px;
      background-color: lightcoral;
      margin: 20px;
      color: white;

      transition: all, 0.5s;
    }
    .translate:hover{
      transform: translate(50%, 50%);
    }
    .scale:hover{
      transform: scale(1.3);
    }
    .rotate:hover{
      transform: rotate(30deg);
    }
    .complext:hover{
      transform: translate(50%, 50%) scale(1.3) rotate(30deg);
    }
    .skew:hover{
      transform: skew(10deg, -30deg);
    }

    .origin{
      transform-origin: 200% 1000%;
    }

    .parent{
      width: 300px;
      height: 300px;
      border: 1px solid red;

      position: relative;
    }
    .child{
      width: 100px;
      height: 100px;
      border: 1px solid red;
      position: absolute;
      /* top: 50px; */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

  </style>
</head>
<body>
  
  <div class="box">translate</div>
  <div class="box translate">translate</div>
  <div class="box scale">translate</div>
  <div class="box rotate origin">translate</div>
  <div class="box complext">complext</div>
  <div class="box skew">skew</div>



  <div class="parent">
    분모
    <div class="child">
      분자
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      border: 1px solid greenyellow;
      height: 300px;
      width: 500px;
      
      /* flex-direction: row-reverse; */
      display: flex;
      /* justify-content: space-between; */
      /* align-items: stretch;
      align-items: flex-start; */
      /* flex-wrap: wrap; */
    }
    .container .item{
      border: 1px solid blue;
      background-color: aqua;
      width: 50px;
    }
  </style>
</head>
<body>
  
  <div class="container">
    <div class="item">1</div>
    <!--
    order 기본값 0,
    order 값이 클수록 뒤에 출력됨
    같으면 html 작성성순으로 표시
    html 수정없이 다르게 출력가능 = order
    -->
    <div class="item" style="order: 1">2</div>
    <div class="item" style="order: -1">3</div>
    <div class="item" style="flex-grow: 1; flex-shrink: 4;">4</div>
    <div class="item" style="flex-grow: 3; flex-shrink: 2;">5</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .red {
      color: red;
    }
  </style>
</head>
<body>
  <h1 id="title">DOM 연습</h1>

  <div id="view">첫 view</div>
  <div id="view">둘 view</div>

  <div class="div2">첫번째 .div</div>
  <div class="div2">둘번째 .div</div>

  <div id="parent">
    <div class="child div2" >안쪽 div</div>
    <div class="child">안쪽 div</div>
  </div>

  <img title="안쪽 div" human="class1" src="https://cdn.pixabay.com/photo/2023/09/13/07/29/ghost-8250317_640.png" style="width: 200px;">

  <br>
  <input type="text" class="intext">
  
  
  <script>
    // document 는 html 문서 전체를 뜻함
    // getElementById : 속성 id의 값을 이용해 dom을가져온다.
    let title = document.getElementById("title");
    console.log(title);
    console.log(""+title);
    // alert(title)

    // 요소가없는경우 null 출력
    let test = document.getElementById("test");
    console.log(test);
    
    // id가 여러개인경우 첫번째 dom 하나만 가져온당
    let view = document.getElementById("view");
    console.log(view);

    // tag명으로 dom찾기
    // 일치하는 모든것을 배열로 돌려줌
    let divs = document.getElementsByTagName("div");
    console.log(divs);

    // 한개만있어도 한개짜리 배열 생성
    let h1 = document.getElementsByTagName("h1");
    console.log(h1);
    
    // 없어도 null 이아닌 비어있는(0짜리) 배열을 생성함
    let human = document.getElementsByTagName("human");
    console.log(human);
    
    let div2 = document.getElementsByClassName("div2")
    console.log(div2);

    // document = 문서전체
    let parent = document.getElementById("parent");
    console.log(parent);
    // 특정 dom 안에서 찾기
    let child_div2 = parent.getElementsByClassName("div2")
    console.log(child_div2);
    // 위와 같다.
    // child_div2 = document.getElementById("parent").getElementsByClassName("div2")

    let qs1 = document.querySelector("#parent .div2");
    console.log(qs1);

    console.log("--------------");
    let qs2 = document.querySelector('.div2');
    console.log(qs2);

    // let qs3 = document.querySelector("#human");
    // console.log(qs3);

    let qsa1 = document.querySelector(".div2");
    console.log(qsa1);
    let qsa2 = document.querySelectorAll(".div2");
    console.log(qsa2);

    // 부모DOM으로 이동
    let child = document.querySelector('#parent .div2');
    console.log(child);
    let parent1 = child.parentNode;
    console.log(parent1);
    
    // classList : class를 배열형식으로 돌려줌
    console.log(child.classList)
    // classList.add() : class추가
    child.classList.add ("red");
    // 중복 불가
    child.classList.add ("red");
    
    // 해당 클래스 삭제
    child.classList.remove ("red");
    child.classList.remove ("red2");
    
    // toggle : 있으면 remove, 없으면 add
    child.classList.toggle ("red");
    child.classList.toggle ("red");
    child.classList.toggle ("red");
    
    // DOM 요소에 지정한 클래스 값이 있는지 체크합니다.
    // 해당 요소에 지정한 클래스 값이 있으면 true를 반환하고, 없으면 false를 반환합니다.
    let isred = child.classList.contains ("red");
    console.log(isred)
    // toogle 구현
    // red가있으면 삭제 , 없으면 add

    function toggle1 (){
      if( isred == true ){
        child.classList.remove("red");
      } else {
        child.classList.add("red");
      }
      isred = child.classList.contains ("red");
    }
    toggle1();
    console.log(isred);

    // class.Name : 모든 class 를 문자로 돌려줌
    console.log( child.className );
    child.className = "blue"

    // css 선택자 중에 속석응로 선택하는걸로 querySelector 사용해보기
    // contains 구현하기
    // let A1 = document.querySelector(".intext")
    // console.log(A1)
    // function conta1n(){
    //   if ( A1 == null){
        
    //   }
    // }
    
    // 답
    // css 선택자 중에 속석응로 선택하는걸로 querySelector 사용해보기
    document.querySelector("[id=intext]");
    // contains 구현하기
    function conta2n (element, name){
      for(let i = 0 ; i < element.classList.length ; i++){
        if(element.classList[i] == name){
          return true;
        }
      }
      return false;
    }
    
    let img = document.getElementsByTagName("img");
    console.log(img);
    console.log(img.classList)
    console.log(img[0].classList);

    // 속성이 있는가 를 물어보고 ture false 를 반환
    let isSrc = img[0].hasAttribute("src");
    console.log(isSrc);
    isSrc = img[0].hasAttribute("readonly");
    console.log(isSrc);

    // 속성의 값을 가져옴.
    let src = img[0].getAttribute("src");
    console.log(src);
    // 속성이없으면 널
    src = img[0].getAttribute("readonly");
    console.log(src);

    img[0].setAttribute("huhu", "1강의실");
    img[0].setAttribute("src", "https://www.jaenung.net/storage/list_img4/1592919738590850_1718463065.png");

    
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="msg">
    <span>원래 </span>    z    있떤 글
  </div>

  <div id="test"></div>
  <!-- <div>
    부모 <span>span안쪽</span>
    <div>안쪽 div</div>
  </div> -->
  id : <input type="text" id="id" value="미리적음"><br>
  date : <input type="date" id="date"><br>
  radio : <input type="radio" name="ai" value="1"checked=checked>gpt
  radio : <input type="radio" name="ai" value="2">gamini
  radio : <input type="radio" name="ai" value="3">bing
<br>
  <select id="select">
    <option value="1">첫째</option>
    <option value="2">둘째</option>
  </select>
<br>
  <textarea id="textarea" cols="50" rows="10"></textarea>

  <script>
    let msg = document.querySelector("#msg");
    // textContent : 컨텐츠영역의 소스 중 text 만 그대로 가져옴
  console.log('textContent :', msg.textContent);

  // innerText : 브라우저에 보이는 그대로 출력
  console.log('innerText :', msg.innerText);

  // innerHTML : html 소스를 전부가져옴
  console.log('innerHTML :', msg.innerHTML);

  // 이 두개는 값을넣으면 컨텐츠로 바꿔줌.
  // 그ㅓㄹㄴ데 tag도 글씨로 인식함
  msg.textContent = "<h1>하하호호</h1>     띄어쓰기           ㅋ"
  msg.innerText = "<h1>하하호호</h1>     띄ㅋ어ㅋ쓰ㅋ기ㅋ           ㅋ"

  // innerHTML : tag는 제대로 인식함
  msg.innerHTML = "<h1>하하호호</h1>     띄ㅋ어ㅋ쓰ㅋ기ㅋ           ㅋ"

  // msg.innerHTML = '<script/> alert(1)';

  msg.innerHTML = msg.innerHTML + "<h2>제목2</h2>"
  msg.innerHTML = msg.innerHTML + "<h2>제목2</h2>"
  msg.innerHTML += "<h2>제목ㅋ</h2>"
  // -------------------------------------------
  // <div id="menu" style="color:red,">
  //   메뉴
  // </div> 
  let div = document.createElement("div");//<div></div> 
  div.setAttribute("id","menu");
  div.setAttribute("style","corol: red;");
  div.textContent = '메뉴';
  div.classList.add = '메뉴';

  // appendChild : 마지막 자식요소로 들어간다. DOM만 넣을 수 있다
  //msg.appendChild(div)
  // append : 마지막 자식요소로 들어간다. DOM도 넣을수있고 text도 넣을수 있다
  msg.appendChild(div);
  msg.append("그냥 글씨");
  msg.append("<strong>그냥 글씨<strong>"); //글씨도 들어간다

  //맨위로올려줌
  msg.prepend(div)

  // 다음 형제 요소로 삽입
  msg.after(div)
  // 이전 형제 요소로 삽임 
  msg.before(div)

  let html =   `</div>
                  부모 <span>span안쪽</span>
                  <div>안쪽 div</div>
                <div>`
  // let html2 =   "</div>"
  // html2 +=   "부모 <span>span안쪽</span>"
  // html2 +=   "<div>안쪽 div</div>"
  // html2 += "<div>"

  document.querySelector('#test').innerHTML = html;

  // html 글씨를 html 요소로 만들어줌
  // <html><head><body>도 같이만들어서 body 안에 넣어 준다.
  let dom = new DOMParser().parseFromString(html, "text/html");
  console.log(dom);
  console.log(dom.documentElement);
  let div2 = dom.documentElement.querySelector("body>div");
  div.append(div2)

  setTimeout(
    function(){
      const text = document.querySelector("#id");
      console.log(text.value);

      const date = document.querySelector("#date");
      console.log(date.value);

      const ai = document.querySelector("[name=ai]:checked")
      console.log(ai.value);

      const ais = document.querySelectorAll("[name=ai]");
      for( let i = 0 ; i < ais.length ; i++){
        console.log(ais[i].checked);
        if(ais[i].checked){
          console.log(ais[i].value);
        }
      }

      const select = document.querySelector("#select");
      console.log(select.value);

      const textarea = document.querySelector("#textarea");
      console.log(textarea.value)

      let test = textarea.value.replace(/123/g, "일이쌈");
      console.log(test)

    } , 4 * 1000
  );
  

  </script>
</body>
</html>

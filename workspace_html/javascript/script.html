<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    // 함수는 function 으로 선언
    // function 함수명(전달인자, 변수명들)
    // 전달인자에 타입X

    // 함수 사용이유
    // 정해진순으로 동작하는 코드의 묶음
    // 재사용 편리

    function plus(x,y){
      let z = x + y;
      return z;
    }

    let a = plus(2,3);
    console.log("a:",a);
    console.log("-----------------")
    function plus3(x=5,y=6){
      console.log("x:",x);
      console.log("y:",y);
      return x+y;
    }
    console.log("-----------------")
    console.log(plus3(1,2));
    console.log(plus3());
    
    console.log("-----------------")
    //spread 연산자 (스프레드 연산자)
    // 가변적인 전달인자를 받을수있음
    function log(...obj){
      console.log(typeof obj);
      console.log(obj[0]);
      console.log(obj[2]);
    }
    log(1,2,3)
    
    console.log("-----------------")
    let d = [100, 200];
    console.log(d);
    console.log(...d);
    
    console.log( plus(d[0], d[1]));
    console.log( plus(...d));
    
    let f = "console.log(123)";
    eval(f); //String을 javascript 로 변환

    function plus4(){
      console.log("plus4 실행!");
    }
    
    let p = plus4;
    console.log(typeof p);
    p();
    
    function plus5(){
      console.log("plus4 실행!");
    }
    console.log(typeof plus5);
    plus5 = 3
    console.log(typeof plus5);

    let times = function (a,b){
      return a*b;
    }
    console.log(times(3,4))

    function pay(n, cb){
      console.log("pay실행");

      let ramen = 2500;

      let result = cb(ramen, n);
      console.log("결과 :", result);
    }
    pay(10, times);

    let print5 = function(){
      console.log("5초뒤");
    }
    setTimeout(print5, 5000);

    setTimeout( function(){
      console.log("6초뒤");
    }, 6000);

    let c=1;
    let idx = setTimeout( function(a,b){
      console.log("a",a);
      console.log("b",b);
      console.log("c",c);
    }, 6*1000, c,20)
    console.log("idx :",idx);


  </script>
</head>

</body>
</html>

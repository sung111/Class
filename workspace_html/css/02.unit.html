<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    #pixel .box1{
      font-size: 16px;
      border: 1px solid red;
      width: 100px;
      background: #ff0000;
    }
    #pixel .box1 .box2{
      font-size: 30px;
      border: 1px solid red;
      width: 100px;
      background: #00ff00;
    }
    #pixel .box1 .box2 .box3{
      font-size: 50px;
      border: 1px solid red;
      width: 100px;
      background: #0000ff;
    }

    #percent .box1{
      font-size: 150%;
      border: 1px solid red;
      width: 50%;
      background: rgba(255, 0, 0, 0.2);
    }
    #percent .box1 .box2{
      font-size: 150%;
      border: 1px solid red;
      width: 50%;
      background: rgba(0, 0, 255, 0.2);
    }
      
    #percent .box1 .box2 .box3{
      font-size: 150%;
      border: 1px solid red;
      width: 50%;
      background: rgba(0, 255, 0, 0.3);
    }
      
    
    #em .box1{
      font-size: 1.5em;
      border: 1px solid red;
      width: 10em;
    }
    #em .box1 .box2{
      font-size: 1.5em;
      border: 1px solid red;
      width: 10em;
    }
    #em .box1 .box2 .box3{
      font-size: 1.5em;
      border: 1px solid red;
      width: 10em;
    }

    input[type=radio]:checked{
      width: 100px;
      height: 100px;
    }
    /* +  : 바로다음 형제요소 */
    input[type=radio]:checked + span{
      background: green;
      font-size: 100px;
    }

  </style>
</head>

<body>

  abc
<div id="pixel">
  <div class="box1">
    abc16
    <div class="box2">
      abc30
      <div class="box3">
        abc50
      </div>
    </div>
  </div>
</div>

<hr>
<div id="percent">
  <div class="box1">
    150%
    <div class="box2">
      150%
      <div class="box3">
        150%
      </div>
    </div>
  </div>
</div>

<hr>
<div id="em">
  <div class="box1">
    1.5
    <div class="box2">
      1.5
      <div class="box3">
        1.5
      </div>
    </div>
  </div>
</div>

<input type="radio" name="name"><span>한식</span><br>
<input type="radio" name="name"><span>중식</span><br>

<p style="height: 1000px;"></p>

</body>
</html>
